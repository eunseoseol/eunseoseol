<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eunseo Seol · Photos</title>
    <meta name="description" content="설은서의 사진 아카이브입니다." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./photo.css" />
  </head>
  <body class="photo-page">
    <header class="photo-header">
      <nav aria-label="Photo navigation">
        <a href="/">Home</a>
        <a href="/book">Library</a>
      </nav>
      <p>Photos</p>
      <h1>Eunseo's Photos</h1>
    </header>

    <main class="photo-library" aria-label="Eunseo photo library">
      <figure class="photo-card portrait-card">
        <img src="../assets/photos/eunseo-profile.jpeg" alt="Eunseo Seol profile portrait" />
        <figcaption>
          <span>Portrait</span>
          <strong>Eunseo Seol</strong>
        </figcaption>
      </figure>

      <figure class="photo-card wide-card">
        <img src="../assets/photos/eunseo-classroom.jpeg" alt="Eunseo working on a laptop in a classroom filming scene" />
        <figcaption>
          <span>Archive</span>
          <strong>Middle school startup days</strong>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
